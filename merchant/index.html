<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e10" />
  <title>Silver Tongue · merchant town</title>
  <link rel="icon" href="data:," />
  <style>:root {
  color-scheme: dark;
  --bg: #0b0e10; --surface: #0f1417; --text: #d6dde3; --muted: #a1adb5;
  --accent: #7fd3e6; --rule: #33474f; --paper: #e8e1cf; --ink: #24241f;
  --reading: #514d43; --warning: #e0b04f;
  font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  font-size: 16px; line-height: 1.65;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, input, textarea { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .45; }
button, input, textarea { border-radius: 4px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
h1:focus { outline: none; }
h1, h2, p { margin: 0; overflow-wrap: anywhere; }
h1 { font-size: 1.45rem; font-weight: 600; line-height: 1.4; text-wrap: balance; }
h2 { font-size: 1rem; font-weight: 600; margin: 1.4rem 0 .7rem; }
p + p { margin-top: .8rem; }
.game { max-width: 860px; min-height: 100dvh; margin: auto; background: var(--surface); display: flex; flex-direction: column; }
.masthead, .calendar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.75rem; border-bottom: 1px solid var(--rule); }
.brand { color: var(--accent); font-weight: 600; }
.masthead .subtle { font-size: .85rem; }
.calendar { font-size: .85rem; color: var(--muted); padding-block: .6rem; }
main { flex: 1; padding: 2rem 1.75rem 3rem; }
.objective { margin-bottom: 1.8rem; }
.objective > span { display: block; color: var(--muted); font-size: .8rem; margin-bottom: .4rem; }
.context { max-width: 65ch; color: var(--text); margin-bottom: 1.5rem; }
.subtle { color: var(--muted); }
.small { font-size: .85rem; }
.arrival { max-width: 600px; padding-top: clamp(1rem, 7vh, 5rem); margin: auto; }
.arrival h1 { color: var(--accent); font-size: 2rem; margin-bottom: 1.7rem; }
.arrival > p { margin-bottom: 1rem; }
.name-form { display: grid; gap: 1rem; margin-top: 2.5rem; }
input, textarea { color: var(--text); background: var(--bg); border: 1px solid var(--rule); padding: .8rem; width: 100%; min-height: 48px; }
textarea { resize: vertical; min-height: 88px; max-height: 240px; }
textarea::placeholder { color: var(--muted); opacity: 1; }
button { min-height: 48px; padding: .7rem 1rem; border: 1px solid var(--rule); background: transparent; color: var(--text); }
button:hover:not(:disabled) { border-color: var(--accent); }
.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.primary:hover:not(:disabled) { background: #a5e4f0; }
.secondary { color: var(--accent); }
.advance { margin-top: 1.5rem; }
.advance span { margin-left: 1rem; }
.speaker { color: var(--accent); font-size: .85rem; margin: .5rem 0; }
.spoken-text { white-space: pre-wrap; }
.large .spoken-text { font-size: 1.35rem; line-height: 1.6; }
.reading, .meaning { font-size: .9rem; color: var(--muted); margin-top: .25rem; }
.listen { border: 0; color: var(--accent); padding-left: 0; font-size: .8rem; min-height: 44px; }
.choices { display: flex; flex-direction: column; gap: .8rem; margin-top: 2rem; }
.reply { background: var(--paper); color: var(--ink); text-align: left; border: 0; padding: 1rem 1.25rem; }
.reply:hover:not(:disabled) { background: #f3eedf; }
.reply .spoken-text { font-size: 1.15rem; font-weight: 600; }
.reply .reading, .reply .meaning { color: var(--reading); }
.message { margin: 0 0 1.2rem; }
.message.player { color: var(--accent); margin-left: 1.5rem; }
.message.world { color: var(--muted); font-size: .95rem; }
.message.npc .spoken-text { font-size: 1.15rem; }
.reaction-beat .message:last-child { margin-top: 2rem; }
.notice { background: #15272e; padding: 1rem; margin-bottom: 1.6rem; }
.notice .spoken-text { font-size: .95rem; }
.time-budget { color: var(--accent); margin: 1rem 0 .25rem; }
.last-call { color: var(--warning); font-size: .9rem; margin: 1rem 0; }
.preparations { margin-top: 1.5rem; }
.prep-option { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; text-align: left; padding: 1.1rem .5rem; }
.prep-option strong { display: block; color: var(--accent); font-weight: 500; }
.prep-option span { display: block; color: var(--muted); font-size: .9rem; margin-top: .3rem; }
.reserved { padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.5rem; }
.reserved button { margin-top: 1rem; }
.text-action { border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; margin: 1rem 0 .4rem; padding-left: 0; }
.resource-list { font-size: .85rem; color: var(--muted); margin: 1.2rem 0; }
.market-facts { padding-bottom: .5rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.5rem; }
.market-facts p + p { margin-top: .3rem; }
.conversation { max-height: 42vh; overflow-y: auto; overscroll-behavior: contain; padding-right: .75rem; scrollbar-gutter: stable; }
.terms { background: #172c30; padding: 1rem 1.25rem; margin: 1.5rem 0; }
.terms h2 { margin-top: 0; }
dl { display: grid; grid-template-columns: 1fr auto; gap: .4rem 1rem; font-size: .9rem; }
dt { color: var(--muted); } dd { margin: 0; text-align: right; }
.terms button { margin-top: 1rem; width: 100%; }
.composer { margin-top: 1rem; }
.composer-actions { display: flex; justify-content: space-between; gap: .75rem; margin-top: .75rem; }
.closing-line { color: var(--accent); font-size: 1.3rem; margin: 2rem 0 1rem; }
footer { padding: 1rem 1.75rem calc(1rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--rule); }
.footer-actions { display: flex; gap: 1rem; }
.footer-actions button { border: 0; padding: .6rem 0; color: var(--accent); min-width: 60px; }
.save-status { display: block; font-size: .75rem; margin-top: .5rem; }
dialog { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--text); padding: 0; width: min(700px, calc(100% - 2rem)); max-height: 85dvh; }
dialog::backdrop { background: rgb(0 0 0 / .75); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--rule); }
.dialog-head h1 { font-size: 1.15rem; }
.dialog-body { padding: 1.25rem; }
.settings { display: flex; flex-wrap: wrap; gap: .7rem 1.25rem; }
.settings label { display: flex; align-items: center; gap: .6rem; min-height: 48px; }
.settings input { width: 20px; min-height: 20px; accent-color: var(--accent); }
.word-list { display: grid; gap: 1rem; margin-top: 1.5rem; }
.phrase-list { display: flex; flex-direction: column; gap: .6rem; }
.phrase { text-align: left; }
.modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
.journal { margin-top: 1.5rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 560px) {
  :root { font-size: 16px; }
  .masthead, .calendar { padding-inline: 1rem; }
  .masthead { gap: .25rem; }
  .masthead .subtle { font-size: .75rem; }
  main { padding: 1.5rem 1rem 2rem; }
  .arrival { padding-top: 1rem; }
  .arrival h1 { font-size: 1.7rem; }
  .calendar { gap: .3rem; }
  .conversation { max-height: 38dvh; }
  footer { padding-inline: 1rem; }
  .reply { padding: .9rem 1rem; }
  .composer-actions button { flex: 1; padding-inline: .5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .story-beat, .reaction-beat, .ending-story { animation: appear 180ms ease-out; }
  @keyframes appear { from { opacity: .65; } to { opacity: 1; } }
}
</style>
</head>
