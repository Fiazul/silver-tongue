name: pages
# Builds the browser game (packages/tui-web) and the 3D street (packages/world3d) and deploys
# them to GitHub Pages on every push to main: the TUI at the site root, the 3D game under
# /world3d/ (every world3d URL is relative, so a fork's <user>.github.io/silver-tongue/world3d/
# works too). world3d's GLBs are vendored in packages/world3d/assets: no external asset library.
# Needs Pages turned on for the repository with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:course
      - run: npm run build:web
      - run: npm run build -w @silver-tongue/world3d
      - name: Assemble the site (tui-web at /, world3d at /world3d/)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R packages/tui-web/dist/. _site/
          mkdir -p _site/world3d
          cp -R packages/world3d/dist/. _site/world3d/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
