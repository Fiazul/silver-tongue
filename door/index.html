    <style>
/* The quiet terminal. Expected state is whitespace; ink goes to what deviates. Palette from the design mockup. */
:root {
  color-scheme: dark;
  --bg: #0b0e10;
  --panel: #0f1417;
  --line: #1e6f80;
  --cyan: #7fd3e6;
  --green: #8be08b;
  --text: #d6dde3;
  --muted: #6f7d88;
  --amber: #e0b04f;
  --red: #e07a7a;
  /* Local fonts only: the site makes no third-party requests. */
  --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.65 var(--mono); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
#app { height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:disabled { cursor: default; opacity: 0.35; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
p { margin: 0; }

.term {
  height: 100%; max-width: 860px; margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--panel); border-inline: 1px solid var(--line);
}
.dim { color: var(--muted); }
.amber { color: var(--amber); }
.cyan { color: var(--cyan); }
.green { color: var(--green); }
.bad { color: var(--red); }
.cur { color: var(--cyan); }

/* Anchor row: one line, always. */
.anchor {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 1.5rem;
  padding: 0.6rem 1rem; border-bottom: 1px solid var(--line);
}
.anchor .flags { display: flex; flex-wrap: wrap; gap: 0 1.25rem; margin-left: auto; text-align: right; }

/* Transcript */
.body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1rem; overscroll-behavior: contain; }
.log { display: flex; flex-direction: column; gap: 0.15rem; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.35rem 0; }
.prose.warn { color: var(--muted); }
/* Stage direction and a miss's narration: dim italic. Outcomes keep their own tones. */
.prose.react, .prose.narr { color: var(--muted); font-style: italic; }
.prose.good { color: var(--green); }
.prose.done { color: var(--muted); margin: 0.15rem 0; }
.prose.day { margin-top: 1.25rem; color: var(--muted); }
.ln { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.1rem; margin-top: 0.5rem; overflow-wrap: anywhere; }
.ln .who { color: var(--cyan); }
.ln .sep { white-space: pre; }
.ln.you .who { color: var(--muted); }
/* An NPC's reaction reads like any NPC line; only the narration above it is dim. */
.ln .restate { margin-left: 1ch; }
.ln.tap { cursor: pointer; }
/* With the Book, an NPC's label and ? stay on the line's first row; the words (and a restated request) wrap inside. */
.ln.npc.book { flex-wrap: nowrap; } .ln.npc.book > * { flex-shrink: 0; } .ln.npc.book > .line, .ln.npc.book > .restate { flex-shrink: 1; min-width: 0; }
.ln .q { color: var(--line); margin-left: auto; padding: 0 0.4rem; }
.ln .q:hover, .ln .q[aria-expanded="true"] { color: var(--cyan); }
.ln .tag { color: var(--muted); font-size: 0.8em; margin-left: auto; }
.ln .cost { color: var(--muted); margin-left: 2ch; }
.ln .cost.mixup { color: var(--red); }
.ln .prose-in { white-space: pre-wrap; }
.w { border-radius: 2px; }
.w:hover { color: var(--cyan); }
.w.new { color: var(--cyan); border: 1px solid var(--line); padding: 0 3px; }
.w.sounded { font-weight: 700; color: #fff; }
.w.shaky { border-bottom: 1px dotted var(--muted); }
.gl { padding-left: 2.5rem; overflow-wrap: anywhere; }
.gl .conn { color: var(--line); }
.gloss { color: var(--cyan); }
.hint { margin: 0.35rem 0 0 2.5rem; color: var(--muted); font-size: 0.85em; }
.gl .play { color: var(--muted); margin-left: 0.6rem; }

/* Prompt */
.prompt { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.1rem; }
.opt { display: flex; gap: 1rem; padding: 0.2rem 0 0.2rem 0.75rem; overflow-wrap: anywhere; }
.opt.onb { align-items: flex-start; padding-top: 0.45rem; padding-bottom: 0.45rem; }
.opt-body { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; text-align: left; }
.opt-ko { font-size: 1.3em; color: #fff; }
.opt-mean { color: var(--muted); font-size: 0.85em; }
.next-btn.only { align-self: flex-start; margin: 0.25rem 0 0 0.75rem; }
.opt .n, .cmd .n { color: var(--muted); }
.opt:hover .n, .cmd:hover .n { color: var(--cyan); }
.cursor-line { display: flex; align-items: baseline; gap: 0.5rem; margin-top: 0.4rem; }
.cursor-line input, .cursor-line .reply-line { flex: 1; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--line); outline: none; padding: 0; }
.reply-line { white-space: pre; overflow: hidden; cursor: text; }
.reply-line:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
.cursor-line .spacer { flex: 1; }
.cursor-line button { padding: 0 0.4rem; }
.blink { color: var(--cyan); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tiles { display: flex; flex-wrap: wrap; gap: 0.4rem; padding-left: 0.75rem; }
.tile { border: 1px solid var(--line); border-radius: 2px; padding: 0.1rem 0.6rem; }
.tile:hover:not(:disabled) { color: var(--cyan); }
/* Say it, inline after the tiles so a thumb doesn't travel to the ↵ at the far edge. */
.tile.send { color: var(--green); border-color: var(--green); }
.tile.send:hover:not(:disabled) { color: var(--bg); background: var(--green); }
/* › in its own column, so wrapped commands line up under the first. */
.cmds { display: grid; grid-template-columns: auto 1fr; column-gap: 0.6rem; align-items: baseline; color: var(--muted); }
.cmd-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 1.4rem; min-width: 0; }
.cmd { display: inline-flex; gap: 0.5rem; color: var(--muted); padding: 0.15rem 0; }
.cmd:hover { color: var(--text); }
.cmd.off { opacity: 0.55; }
/* With the Book: everything but the one bright control, on one quiet row under it. */
.also { display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; margin: 0.7rem 0 0 0.75rem; }
.also button { display: inline-flex; gap: 0.5rem; padding: 0.3rem 0; color: var(--muted); }
.also button:hover { color: var(--text); }

.toasts { display: flex; flex-direction: column; align-items: flex-start; margin-top: 0.75rem; }
.toast { color: var(--muted); font-size: 0.9em; }
.toast.good { color: var(--green); }
.toast.bad { color: var(--red); }

/* Bottom bar and touch keys */
.bar { display: flex; gap: 1.5rem; padding: 0.4rem 1rem; border-top: 1px solid var(--line); font-size: 0.85em; }
.bar button:hover { color: var(--text); }
.keybar { display: none; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; border-top: 1px solid var(--line); }
.keybar button { text-align: center; padding: 0.6rem 0; border: 1px solid var(--line); border-radius: 2px; }
@media (pointer: coarse) { .keybar { display: grid; } }

/* Overlays: a full terminal screen of their own. */
.overlay { position: fixed; inset: 0; z-index: 10; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; background: var(--panel); max-width: 860px; margin: 0 auto; border-inline: 1px solid var(--line); }
.ov-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 1.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
.ov-head .close { margin-left: auto; }
.ov-body { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
.nb-grid { display: grid; grid-template-columns: auto auto 1fr auto; gap: 0.1rem 1.5rem; }
.nb-grid.three { grid-template-columns: auto auto 1fr; }
.nb-row { display: contents; }
.nb-row > span { padding: 0.1rem 0; overflow-wrap: anywhere; }
.nb-row:hover .nb-w { color: var(--cyan); }
.nb-r { color: var(--muted); }
.nb-place { color: var(--green); margin-top: 0.8rem; }
.nb-note p { color: var(--muted); }
.letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: 0.25rem 0.75rem; }
.letter { display: flex; flex-direction: column; align-items: flex-start; padding: 0.2rem 0; }
.letter .nb-w { font-size: 1.4em; } .letter:hover .nb-w { color: var(--cyan); }
.nb-paper { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1.5rem; width: 100%; padding: 0.2rem 0; text-align: left; }
.nb-paper:hover span:first-child { color: var(--cyan); }
.paper-body { padding: 0.2rem 0 0.6rem 1.5rem; } .paper-body p { margin: 0.1rem 0; }
.blank { border-bottom: 1px dashed var(--muted); margin: 0 0.15em; }
ruby { ruby-position: under; -webkit-ruby-position: after; ruby-align: center; white-space: nowrap; } rt { font-size: 0.72em; color: var(--muted); padding: 0 0.3em; white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-top: 1.2rem; }
.link { color: var(--cyan); }
.tabs { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
.tab { color: var(--muted); padding: 0.1rem 0; border-bottom: 2px solid transparent; }
.tab.on { color: var(--cyan); border-bottom-color: var(--cyan); }
.st-people { margin-top: 0.8rem; }
/* The people on the status page, and one person's page. */
.person { display: flex; align-items: center; gap: 0.75rem; min-height: 44px; }
.person > :first-child { flex: 1; }
.p-small { font-size: 0.85em; }
.p-head { display: flex; flex-direction: column; gap: 0.3rem; padding-bottom: 0.6rem; }
.p-name { font-size: 1.25em; }
.p-tabs { gap: 0.25rem 1.25rem; border-bottom: 1px solid #1e2a30; margin-bottom: 0.8rem; }
.p-tabs .tab { min-height: 40px; }
.p-tips, .p-talks { display: flex; flex-direction: column; gap: 1rem; }
.p-sub { padding-left: 1.4rem; }
.p-talks { gap: 0.4rem; }
.p-talk-head { display: flex; gap: 0.6rem; align-items: center; width: 100%; min-height: 40px; }
.p-talk-title { flex: 1; }
.p-lines { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.4rem 0 0.8rem 1.4rem; }
.p-words { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.p-words > div { display: flex; flex-direction: column; gap: 0.5rem; }
.p-word p { overflow-wrap: anywhere; }
.p-later .p-word { opacity: 0.55; }
.row { display: block; width: 100%; padding: 0.45rem 0; color: var(--text); text-decoration: none; border-bottom: 1px solid #16242a; }
.row:hover { color: var(--cyan); }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 0.5rem; }

/* Title */
.title { justify-content: center; padding: 1.5rem; gap: 0.6rem; }
.title .brand { color: var(--green); font-weight: 700; font-size: 1.4rem; }

@media (max-width: 560px) {
  body { font-size: 14px; }
  .body, .anchor, .ov-body, .ov-head { padding-inline: 0.75rem; }
  .gl { padding-left: 1rem; }
  .nb-grid { column-gap: 0.75rem; }
}
@media (prefers-reduced-motion: reduce) {
  .blink { animation: none; }
  * { scroll-behavior: auto !important; }
}

/* The opening of a book course: the story's crawl, then the name screen. One thing on screen; only what
 * can be acted on pulses. */
.opening {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  padding: calc(env(safe-area-inset-top) + 1rem) 16px calc(env(safe-area-inset-bottom) + 1rem);
}
.crawl-screen { cursor: default; }
.crawl {
  position: relative; max-width: 44ch;
  font-size: clamp(15px, min(4.2vw, 2.5vh), 22px); line-height: 1.55;
}
.crawl p { margin: 0 0 1em; }
.crawl b { color: var(--cyan); font-weight: 700; }
/* Each paragraph comes up from the bottom edge to its place (Opening.tsx animates it); until its turn it
 * keeps its place in the layout, unseen, so the centred block never moves. */
.crawl .go { position: absolute; top: 100%; left: 0; right: 0; margin: 0.5em 0 0; text-align: center; color: var(--cyan); animation: fade-in 0.6s ease-out both; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.name-screen { flex-direction: column; gap: 1.25rem; }
.name-title { font-size: clamp(18px, 5vw, 26px); text-align: center; }
.name-row { display: flex; align-items: baseline; gap: 1rem; width: min(100%, 26ch); font-size: clamp(22px, 7vw, 34px); }
.name-row input {
  flex: 1; min-width: 0; font-size: inherit; background: none; border: 0; border-bottom: 2px solid var(--line);
  padding: 0.1em 0; color: var(--text); caret-color: var(--cyan); outline: none;
}
.name-row input:focus { border-bottom-color: var(--cyan); }
.name-row .go { font-size: 0.55em; color: var(--cyan); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .crawl .go { animation: none; }
  .pulse { animation: none; }
}

/* The desk (book courses with papers): the papers on the desk, read out before the game starts. All in the
 * language; the reading appears, muted, once a line is read. */
.desk-screen {
  position: fixed; inset: 0; z-index: 5; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
  padding: calc(env(safe-area-inset-top) + 1rem) 16px calc(env(safe-area-inset-bottom) + 1rem);
  transition: opacity 0.9s ease-out;
}
.desk-screen.leaving { opacity: 0; }
.desk-screen .bar { display: flex; gap: 1.5rem; }
.desk-title { color: var(--muted); letter-spacing: 0.08em; text-align: center; }
.desk { display: flex; align-items: flex-start; flex-wrap: wrap; justify-content: center; gap: 1rem; max-width: 40rem; }
.desk-card {
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.5rem;
  background: var(--panel); border: 1px solid var(--line); text-align: center;
}
.desk-art { box-sizing: border-box; width: 160px; font-size: 13px; line-height: 1.2; color: var(--muted); display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.desk-art i { display: block; flex: none; }
.desk-art .art-title { text-align: center; white-space: nowrap; overflow: hidden; padding: 2px 0; }
.desk-art .art-rule { height: 0; border-top: 1px solid currentColor; }
.desk-art .art-dots { height: 0; border-top: 2px dotted currentColor; }
.desk-art .art-bar { height: 6px; background: currentColor; opacity: 0.7; }
.desk-art .art-hatch { height: 10px; background: repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 3px); opacity: 0.7; }
.desk-art.art-card { height: 135px; border: 1px solid currentColor; border-radius: 8px; padding: 0 6px 6px; gap: 0; }
.desk-art.art-card .art-title { border-bottom: 1px solid currentColor; margin: 0 -6px; padding: 5px 0; }
.desk-art.art-card .art-card-body { flex: 1; display: flex; gap: 10px; padding-top: 10px; min-height: 0; }
.desk-art.art-card .art-photo { width: 56px; height: 62px; border: 1px solid currentColor; box-sizing: border-box; overflow: hidden; }
.desk-art.art-card .art-fields { flex: 1; display: flex; flex-direction: column; gap: 22px; padding-top: 8px; min-width: 0; }
.desk-art.art-masthead { height: 165px; border: 3px solid currentColor; gap: 4px; padding: 0 6px 6px; }
.desk-art.art-masthead .art-title { border-bottom: 2px solid currentColor; margin: 0 -6px; padding: 4px 0; }
.desk-art.art-masthead .art-double { height: 3px; border-top: 1px solid currentColor; border-bottom: 1px solid currentColor; }
.desk-art.art-masthead .art-cols { display: flex; gap: 6px; flex: 1; }
.desk-art.art-masthead .art-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; justify-content: space-evenly; }
.desk-art.art-masthead .art-col + .art-col { border-left: 1px dashed currentColor; padding-left: 6px; }
.desk-art.art-masthead .art-crease { height: 0; border-top: 1px dashed currentColor; margin: 0 -6px; }
.desk-art.art-bill { height: 120px; border-top: 2px dashed currentColor; border-bottom: 2px dashed currentColor; gap: 8px; padding: 8px 6px; }
.desk-art.art-bill .art-labels { display: flex; flex-direction: column; gap: 8px; }
.desk-art.art-bill .art-amount { flex: 1; border: 1px solid currentColor; display: flex; align-items: center; justify-content: center; }
.desk-art.art-bill .art-amount .art-dots { width: 40%; }
.desk-art.art-bill .art-title { background: var(--line); color: var(--bg); }
.desk-card-state { font-size: 0.85em; color: var(--muted); min-height: 1.2em; }
/* The next card is the only bright one, still (no blinking); the rest are dimmed. */
.desk-card.later, .desk-card.read { border-color: var(--muted); opacity: 0.45; }
.desk-card.read .desk-card-state { color: var(--green); }
.desk-card.next { border-color: var(--cyan); }
.desk-card.next .desk-card-state { color: var(--cyan); font-weight: bold; }
.desk-card.next .desk-art { color: var(--text); }
.desk-card.later .art-title, .desk-card.read .art-title { color: var(--muted); }
.desk-card.next .art-title { color: var(--text); font-weight: bold; }
.desk-card .desk-art.art-bill .art-title { color: var(--bg); }
.desk-card.later .desk-art.art-bill .art-title, .desk-card.read .desk-art.art-bill .art-title { background: var(--muted); }

/* A paper: a paper-coloured panel laid out like the document. */
.paper {
  --ink: #2a2620;
  width: min(100%, 28rem); padding: 1.25rem 1.5rem; background: #e8e1cf; color: var(--ink);
  font-family: var(--mono); display: flex; flex-direction: column; gap: 0.6rem; box-shadow: 0 0 0 1px #0006, 0 8px 24px #0008;
}
.pl { display: flex; flex-direction: column; gap: 0; padding: 0.1rem 0.4rem; }
.pl-text { color: var(--ink); text-align: inherit; white-space: pre-wrap; display: block; }
.pl-rr { color: #7a7263; font-size: 0.75em; line-height: 1.2; min-height: 1.2em; }
/* One character of a line: the syllable, its reading under it once read. Digits and punctuation pass through. */
.sy { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; }
.sy:not(.pass) { min-width: 2.6em; }
.sy-ch { padding: 0 0.1em; border-radius: 3px; border: 2px solid transparent; }
.sy-rr { color: #7a7263; font-size: 0.6em; line-height: 1.2; }
.sy.cur .sy-ch { background: #bfe3ea; border-color: #1e6f80; color: #10404a; font-weight: 700; }
.paper-card { width: min(100%, 22rem); min-height: 13rem; border-radius: 10px; position: relative; padding-right: 7rem; justify-content: center; }
.paper-card::after { content: ""; position: absolute; right: 1.25rem; top: 50%; transform: translateY(-50%); width: 4.5rem; height: 5.6rem; border: 1px solid #0003; background: #d6cfbd; }
.paper-card .pl-title .pl-text { font-weight: 700; letter-spacing: 0.15em; }
.paper-card .pl-name .pl-text { font-size: 1.25em; }
/* A newspaper's masthead: the name large and centred over a rule, the date under it. */
.paper-masthead { align-items: stretch; text-align: center; }
.paper-masthead .pl { align-items: center; }
.paper-masthead .pl-title { border-bottom: 3px double var(--ink); padding-bottom: 0.4rem; }
.paper-masthead .pl-title .pl-text { font-size: 2em; font-weight: 700; letter-spacing: 0.1em; }
.paper-masthead .pl-date .pl-text { font-size: 0.9em; }
/* A bill: a heading, then the amount due, right-aligned and boxed. */
.paper-bill { border-top: 6px solid #9b3b32; }
.paper-bill .pl-title .pl-text { font-size: 1.2em; font-weight: 700; }
.paper-bill .pl-amount { align-items: flex-end; }
.paper-bill .pl-amount .pl-text { font-size: 1.4em; border: 1px solid var(--ink); padding: 0.1em 0.5em; }

.desk-screen.reading { justify-content: flex-start; gap: 0.5rem; overflow-y: auto; }
.desk-screen.reading .bar { margin-top: auto; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; width: min(100%, 28rem); }
.paper.compact { padding: 0.6rem 0.9rem; gap: 0.25rem; font-size: 14px; }
.paper.compact.paper-card { min-height: 0; padding-right: 5rem; }
.paper.compact.paper-card::after { width: 3.2rem; height: 4rem; right: 0.9rem; }
.paper.compact.paper-masthead .pl-title .pl-text { font-size: 1.7em; }
.paper.compact.paper-bill .pl-amount .pl-text { font-size: 1.2em; }
.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.link path { fill: none; stroke: var(--cyan); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.8; }
.take { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; }
.intro { color: var(--muted); font-size: 0.9em; text-align: center; }
.big { font-size: 3rem; line-height: 1; padding: 0.15em 0.4em; border: 2px solid var(--cyan); background: var(--panel); color: var(--text); }
.sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.35rem 0.4rem; width: 100%; }
.sum .op { color: var(--muted); }
.sum input {
  flex: 1 1 5.5rem; min-width: 0; font-size: 1.05em; background: none; border: 0; border-bottom: 2px solid var(--cyan);
  padding: 0.2em 0; color: var(--text); caret-color: var(--cyan); outline: none;
}
.sum input::placeholder { color: var(--muted); }
.sum .go { color: var(--cyan); white-space: nowrap; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.15rem 0.45rem; min-width: 3rem; min-height: 3.1rem; border: 1px solid var(--line); background: var(--panel); text-align: center; }
.tile .tl-ch { font-size: 1.3em; line-height: 1.1; }
.tile .tl-rd { color: var(--muted); font-size: 0.68em; line-height: 1.15; }
.tile.unknown .tl-rd { color: var(--cyan); font-size: 0.9em; }
.example { color: var(--muted); font-size: 0.9em; text-align: center; }
.rh-full { color: var(--amber); font-weight: 700; text-align: center; }
.learned { text-align: center; max-width: 24rem; }
.next-btn { color: var(--cyan); font-weight: 700; border: 1px solid var(--cyan); padding: 0.25rem 1rem; }
.read-tools { display: flex; justify-content: space-between; align-items: baseline; width: 100%; font-size: 0.85em; }
.read-tools .help { color: var(--muted); }
.read-tools .help.hot { color: var(--cyan); font-weight: bold; border-bottom: 1px solid var(--cyan); }
.sum.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.desk-knock { cursor: default; }
.desk-knock .knock { font-size: clamp(18px, 5vw, 26px); animation: fade-in 0.8s ease-out both; }
.desk-knock .go { color: var(--cyan); animation: fade-in 0.6s 0.6s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  .desk-screen { transition: none; }
  .sum.shake { animation: none; outline: 1px solid var(--red); }
  .desk-knock .knock, .desk-knock .go { animation: none; }
}

/* The Book's how-to-read guide: numbered steps, each with tappable examples that look like the chart's letters. */
.guide { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: 0.6rem; }
.guide li::marker { color: var(--muted); }
.guide-text { margin: 0 0 0.2rem; }
.guide-ex { display: flex; flex-wrap: wrap; gap: 0.25rem 1.2rem; }
.guide-ex .letter .nb-r { font-size: 0.85em; }

/* The conversation stage (a course with the Book; Stage.tsx, spec 2026-09-29 section 12). Their world is
 * text on the dark page under a rule in the speaker's colour; everything of yours is paper (say); the cyan
 * outline is the one "do" control. */
.book {
  --paper: #e8e1cf;
  --ink: #2a2620;
  --ink-2: #6e6658;
  --who-0: #8fb6d9;
  --who-1: #d9a86c;
  --who-2: #9fc58d;
  --who-3: #c9a0c8;
  --fs-xs: 12px;
  --fs-sm: 13.5px;
  --fs-md: 15px;
  --fs-lg: 21px;
  --fs-xl: 30px;
  /* The language learned in the system UI face, never a web font: a serif face changes the shapes of letters just learned. */
  --l2-face: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --hist-h: clamp(4.5rem, 19dvh, 11rem);
  --gutter: 16px;
}
.book .hue-0 { --who: var(--who-0); } .book .hue-1 { --who: var(--who-1); }
.book .hue-2 { --who: var(--who-2); } .book .hue-3 { --who: var(--who-3); }
.book .stage-wrap [lang] { font-family: var(--l2-face); }
.book rt { font-family: var(--mono); }

.stage-wrap {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 0 var(--gutter);
}

/* History: a band of fixed height above the stage, scrolled to its newest line. */
.history {
  flex: 0 1 var(--hist-h); min-height: 0; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 0.3rem; padding: 0.75rem 0 0.5rem;
  font-size: var(--fs-sm); line-height: 1.45;
  mask-image: linear-gradient(to bottom, transparent 0, #000 1.5rem);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.5rem);
}
.history > :first-child { margin-top: auto; }
.h-row { display: flex; flex-direction: column; max-width: 85%; animation: rise 0.2s ease-out both; }
.h-their { align-self: flex-start; border-left: 2px solid var(--who); padding-left: 0.6rem; }
.h-their .h-say { color: var(--text); opacity: 0.72; font-size: var(--fs-md); }
.h-mine { align-self: flex-end; align-items: flex-end; }
.h-mine .h-say { background: var(--paper); color: var(--ink); opacity: 0.6; font-size: var(--fs-sm); padding: 0.05rem 0.5rem; border-radius: 2px; }
.h-say { text-align: inherit; overflow-wrap: anywhere; }
.h-say:hover { opacity: 1 !important; }
.h-open { color: var(--muted); font-size: var(--fs-xs); padding-top: 0.1rem; }
.h-note { color: var(--muted); font-size: var(--fs-xs); text-align: center; opacity: 0.85; overflow-wrap: anywhere; }
.h-note.done { opacity: 0.7; }
.h-note.good { color: var(--green); }
.h-note.day { margin-top: 0.4rem; letter-spacing: 0.04em; }

/* The stage: a direction row, their line, your said line. Rows above the line keep their height so it never moves. */
.stage-now { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; padding: 0.25rem 0 1rem; }
.stage-now.loose { justify-content: center; align-items: center; gap: 0.6rem; min-height: 6rem; }
.direction-row { min-height: calc(2 * 1.45 * var(--fs-sm) + 0.6rem); display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 0.6rem; }
.direction {
  color: var(--muted); font-size: var(--fs-sm); line-height: 1.45; text-align: center;
  max-width: 34rem; margin: 0 auto; overflow-wrap: anywhere; animation: fade-in 0.3s ease-out both;
}
.direction.good { color: var(--green); }
.stage-now.loose .direction { font-size: var(--fs-md); line-height: 1.55; }

.their { border-left: 2px solid var(--who); padding-left: 0.9rem; max-width: 40rem; }
.their .who { display: flex; align-items: baseline; gap: 0.75rem; min-height: 1.45em; font-size: var(--fs-sm); color: var(--who); line-height: 1.45; }
.their .tag { color: var(--muted); font-size: var(--fs-xs); border: 1px solid currentColor; border-radius: 2px; padding: 0 0.35rem; line-height: 1.5; animation: fade-in 0.3s ease-out both; }
.say { display: flex; align-items: flex-start; gap: 0.5rem; padding-top: 0.15rem; }
.say-text { font-size: var(--fs-xl); font-weight: 600; line-height: 1.5; color: #f2f5f7; overflow-wrap: anywhere; min-width: 0; }
.say-text ruby { margin-right: 0.08em; }
.say-text rt { font-size: var(--fs-xs); font-weight: 400; color: var(--muted); letter-spacing: 0.02em; line-height: 1.2; padding: 0 0.15em; }
.book .say .w:hover { color: inherit; }
@media (hover: hover) { .book .say .w:hover { color: var(--who); } }
.book .say .w.sounded { font-weight: 800; color: #fff; }
.say .q {
  flex: none; width: 1.75rem; height: 1.75rem; margin-top: 0.55rem; border: 1px solid var(--line); border-radius: 50%;
  color: var(--muted); font-size: var(--fs-sm); display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.say .q:hover, .say .q[aria-expanded="true"] { color: var(--cyan); border-color: var(--cyan); }
.say-mean { color: var(--muted); font-size: var(--fs-md); line-height: 1.45; padding-top: 0.2rem; }
.their .hint { margin: 0.5rem 0 0; font-size: var(--fs-sm); }
.say.enter { animation: rise 0.25s ease-out both; }
/* A repeat: the same line stays and pulses once; the rule brightens with it. */
.say.again { animation: again 0.3s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes again { 0% { transform: scale(1); } 40% { transform: scale(1.025); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }

/* Their reaction to a miss: small, under your said line. */
.their.reaction { margin-top: 0.5rem; padding-left: 0.6rem; border-left-width: 2px; }
.their.reaction .say-text { font-size: var(--fs-lg); font-weight: 500; opacity: 0.85; }

/* Your said line: paper, compact, your side. */
.said-row { display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; margin-top: 0.9rem; }
.said {
  background: var(--paper); color: var(--ink); font-size: var(--fs-lg); line-height: 1.35; font-weight: 500;
  padding: 0.35rem 0.8rem; border-radius: 2px; max-width: 85%; overflow-wrap: anywhere;
  animation: lay 0.28s ease-out both;
}
.said .cost { display: block; font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-2); font-weight: 400; }
.said .cost.mixup { color: #9b3b32; }
@keyframes lay { from { opacity: 0; transform: translateY(2.5rem); } to { opacity: 1; transform: none; } }
/* The sentence being built from tiles sits where your said line goes, ⌫ and ✓ beside it. */
.building .said { animation: none; min-width: 6rem; min-height: 2.4rem; }
.building .said.empty { background: transparent; border: 1px dashed var(--ink-2); }
.building .bt {
  flex: none; width: 2.6rem; height: 2.6rem; display: inline-flex; align-items: center; justify-content: center; text-align: center;
  border-radius: 2px; font-size: 1.05rem;
}
.building .bt.undo { color: var(--muted); border: 1px solid var(--line); }
.building .bt.send { background: var(--paper); color: var(--ink); font-weight: 700; }
/* Nothing laid yet: only the empty slot shows (the pieces are the next action); the row keeps its size. */
.building .bt:disabled { visibility: hidden; }

/* The word card: paper, anchored under the word. */
.word-paper {
  position: absolute; z-index: 4; width: max-content; max-width: min(16rem, 100%);
  background: var(--paper); color: var(--ink); border-radius: 2px; padding: 0.55rem 2.6rem 0.55rem 0.8rem;
  box-shadow: 0 0 0 1px #0006, 0 4px 14px #0007; animation: fade-in 0.15s ease-out both;
}
.word-paper .wp-word { font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; }
.word-paper .wp-reading { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-2); }
.word-paper .wp-mean { font-size: var(--fs-md); line-height: 1.4; }
.word-paper .wp-play {
  position: absolute; top: 0.5rem; right: 0.5rem; width: 1.8rem; height: 1.8rem; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink); border: 1px solid var(--ink-2); border-radius: 50%; font-size: 0.7rem;
}

/* Replies: pinned above the footer, in thumb reach. */
.replies { flex: none; display: flex; flex-direction: column; padding: 0.25rem 0 0.9rem; }
.book .toasts { align-items: center; margin: 0 0 0.5rem; }
.slips { display: flex; flex-direction: column; align-items: stretch; gap: 0.45rem; width: min(100%, 21rem); margin-left: auto; }
.slip {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 0.05rem;
  background: var(--paper); color: var(--ink); border-radius: 2px; padding: 0.45rem 0.85rem 0.5rem; text-align: left;
  box-shadow: 0 1px 0 #0005; animation: rise 0.22s ease-out both;
}
@media (hover: hover) { .slip:hover { box-shadow: 0 0 0 2px var(--cyan); } }
.slip:active { transform: translateY(1px); }
.slip-text { font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.slip-rd { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.35; min-height: 1.35em; white-space: pre-wrap; }
.slip-mean { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.35; }
.slip.tried { opacity: 0.4; animation: none; }
/* Number keys (keyboard only), outside the slip's text. */
.slip .slip-n { position: absolute; right: calc(100% + 0.6rem); top: 0.55rem; color: var(--muted); font-family: var(--mono); font-size: var(--fs-xs); }
.say-nothing { position: relative; align-self: flex-end; color: var(--muted); font-size: var(--fs-sm); padding: 0.35rem 0.1rem 0; }
.say-nothing:hover { color: var(--text); }
.say-nothing .slip-n { position: absolute; right: calc(100% + 0.6rem); color: var(--muted); font-family: var(--mono); font-size: var(--fs-xs); }

/* Tile pieces: paper, on your side; the hint sits over them, aligned with the row. */
.pieces { display: flex; flex-direction: column; align-items: flex-end; gap: 0.45rem; }
.pieces .hint { margin: 0; font-size: var(--fs-sm); text-align: right; }
.pieces .tiles { justify-content: flex-end; padding-left: 0; gap: 0.45rem; }
.book .tile.piece {
  position: relative; min-height: 2.9rem; min-width: 3rem; padding: 0.3rem 0.8rem;
  background: var(--paper); color: var(--ink); border: 0; border-radius: 2px; font-size: var(--fs-lg); font-weight: 600;
  box-shadow: 0 1px 0 #0005;
}
@media (hover: hover) { .book .tile.piece:hover:not(:disabled) { color: var(--ink); box-shadow: 0 0 0 2px var(--cyan); } }
.book .tile.piece:disabled { opacity: 0.25; }
.book .tile.piece .slip-n { position: absolute; top: 0.15rem; left: 0.3rem; font-family: var(--mono); font-size: 10px; font-weight: 400; color: var(--ink-2); }

/* Between scenes: one cyan control, centred; the rest on one quiet row under it. */
.book .replies .prompt { margin-top: 0; align-items: center; }
.book .replies .next-btn.only { align-self: center; margin: 0; padding: 0.55rem 1.4rem; }
.book .replies .also { justify-content: center; margin: 0.6rem 0 0; }
/* Nothing bright: every thing to do is a cyan "do", stacked and centred like the one above. */
.book .replies .dos { display: flex; flex-direction: column; align-items: stretch; gap: 0.6rem; width: max-content; max-width: 100%; }
.book .replies .next-btn.do { position: relative; padding: 0.55rem 1.4rem; text-align: center; max-width: 100%; }
.book .replies .next-btn.do .n { position: absolute; right: calc(100% + 0.6rem); color: var(--muted); font-family: var(--mono); font-size: var(--fs-xs); font-weight: 400; }
.book .replies .prompt > .prose { text-align: center; font-size: var(--fs-sm); }
.book .bar { padding-inline: var(--gutter); }

@media (max-width: 560px) {
  .book { --fs-xl: 28px; }
}
/* Scribe mode (lab): their line in Latin letters, a field for its meaning; bare Latin slips and one field for the reply. */
.sw { display: inline-flex; flex-direction: column; align-items: flex-start; vertical-align: top; }
.sw-g { font-size: var(--fs-xs); font-weight: 400; color: var(--cyan); line-height: 1.2; }
.scribe-field { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.6rem; width: 100%; max-width: 28rem; }
.scribe-form { display: flex; align-items: center; gap: 0.4rem; }
.scribe-form input {
  flex: 1 1 auto; min-width: 0; font: inherit; font-size: var(--fs-md); background: none; border: 0; border-bottom: 2px solid var(--cyan);
  padding: 0.2em 0; color: var(--text); caret-color: var(--cyan); outline: none;
}
.scribe-form input::placeholder { color: var(--muted); }
.scribe-form .go { color: var(--cyan); white-space: nowrap; }
.scribe-form.shake { animation: shake 0.4s ease-in-out; }
.scribe-field .example, .scribe-field .rh-full { text-align: left; }
.scribe-field .read-tools { justify-content: flex-start; }
.scribe-list { display: flex; flex-direction: column; gap: 0.45rem; }
/* In the stage's flow under their line and its meaning, on your side like a said line. */
.scribe-slips { margin-top: 0.9rem; }
.scribe-slips .scribe-field { margin-top: 0.3rem; max-width: none; }
.scribe-slips .slip-text .sw-g { color: var(--ink-2); font-weight: 400; }
.scribe-slips .say-nothing { align-self: flex-end; }
.scribe-slip { animation: none; cursor: default; }
.scribe-slip.selectable { cursor: pointer; width: 100%; }
.book .scribe-say .roman { display: block; font-size: var(--fs-md); }
.scribe-slip:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
@media (hover: hover) { .scribe-slip:hover { box-shadow: 0 1px 0 #0005; } }
.scribe-slip:active { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .h-row, .direction, .their .tag, .say.enter, .say.again, .said, .slip, .word-paper { animation: none; }
  .scribe-form.shake { animation: none; outline: 1px solid var(--red); }
}

.pl-gloss { display: block; font-size: var(--fs-sm); font-style: italic; opacity: 0.85; }

/* Lab opening: working a line out, as a detective thinks. Thoughts float on both sides of the mind, bare words; the one
   held gets a cloud round it; then conclude, or let it go and think again. */
.thoughts { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; margin-top: 0.8rem; width: 100%; }
.thoughts.shake .thought-field { animation: shake 0.4s ease-in-out; }
.thoughts-ask { margin: 0; color: #f3dfa6; font-style: italic; font-size: var(--fs-md); }
.thought-field { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0 0.6rem; width: 100%; max-width: 36rem; }
.thought-side { display: flex; flex-direction: column; gap: 1.1rem; padding: 0.4rem 0; }
.thought-side.left { align-items: flex-end; text-align: right; }
.thought-side.right { align-items: flex-start; text-align: left; padding-top: 1.6rem; }
.thought-mind { font-size: 1.8rem; filter: drop-shadow(0 0 8px #ffcf4a99); }
.thought {
  position: relative; font: inherit; font-size: var(--fs-md); font-weight: 700; line-height: 1.25; cursor: pointer; max-width: 15rem; word-break: keep-all;
  color: #2a1d05; background: linear-gradient(180deg, #ffe79a, #ffd257);
  border: 2px solid transparent; border-radius: 50% / 70%; padding: 0.5em 1em;
  box-shadow: 0 0 14px 2px #ffcf4a99, 0 0 0 1px #c8961f55;
  animation: think-in 0.5s ease-out both, drift 5.5s ease-in-out infinite, glow 2.8s ease-in-out infinite;
  animation-delay: calc(var(--i) * 0.12s), calc(var(--i) * -1.7s), calc(var(--i) * -0.9s);
}
.thought-side.left .thought:nth-child(2n) { margin-right: 1.4rem; }
.thought-side.right .thought:nth-child(2n) { margin-left: 1.4rem; }
.thought.chosen { animation: none; border-color: #2a1d05; background: linear-gradient(180deg, #fff3c4, #ffe07a); box-shadow: 0 0 22px 6px #ffcf4acc, 0 0 0 4px #fff8; }
.thought.chosen::before { content: "▾"; position: absolute; top: -1.15em; left: 50%; transform: translateX(-50%); font-size: var(--fs-md); color: #c8961f; }
.thought:focus-visible { outline: 2px dashed var(--cyan); outline-offset: 3px; }
.thought.tried { opacity: 0.4; filter: grayscale(1); box-shadow: none; animation: none; text-decoration: line-through; cursor: default; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 12px 1px #ffcf4a88, 0 0 0 1px #c8961f55; } 50% { box-shadow: 0 0 20px 4px #ffcf4acc, 0 0 0 1px #c8961f77; } }
/* A wrong thought is said to yourself, in your head: the thought's own voice, never an error. */
.thoughts-miss { margin: 0; font-style: italic; font-size: var(--fs-md); color: #f3dfa6; animation: fade-in 0.3s ease-out; }
.thoughts-miss::before { content: "💭 "; font-style: normal; }
.thought-actions { display: flex; gap: 0.7rem; justify-content: center; }
.thought-act {
  font: inherit; font-size: var(--fs-sm); padding: 0.4em 1.1em; border-radius: 999px; cursor: pointer;
  color: var(--ink, var(--text)); background: color-mix(in srgb, var(--paper, var(--panel)) 75%, white); border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
}
.thought-act:disabled { opacity: 0.4; cursor: default; }
.thoughts .read-tools { justify-content: center; }
.say-thought { font-style: italic; font-size: var(--fs-md); line-height: 1.45; padding-top: 0.25rem; color: #f3dfa6; }
.say-thought::before { content: "💭 "; font-style: normal; }
@keyframes think-in { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
@media (max-width: 480px) {
  .thought-field { gap: 0 0.3rem; }
  .thought { font-size: var(--fs-sm); padding: 0.4em 0.6em; max-width: 9.5rem; }
  .thought-side.left .thought:nth-child(2n) { margin-right: 0.6rem; }
  .thought-side.right .thought:nth-child(2n) { margin-left: 0.6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .thought { animation: none; }
  .thoughts.shake .thought-field { animation: none; }
}

/* Lab page only: the screen number and the jump box (ui/DevBadge.tsx). */
